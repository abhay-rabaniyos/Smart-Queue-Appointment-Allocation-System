[project]
name = "queuepilot"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3", "httpx>=0.28,<1", "alembic>=1.15,<2", "qrcode[pil]>=8,<9"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
