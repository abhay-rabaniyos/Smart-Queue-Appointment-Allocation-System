name: QueuePilot checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: queuepilot
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: queuepilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queuepilot -d queuepilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check app tests
      - run: uv run pytest --cov=app --cov-fail-under=90 -q
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://queuepilot:test-only-password@localhost:5432/queuepilot_test
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://queuepilot:test-only-password@localhost:5432/queuepilot_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
